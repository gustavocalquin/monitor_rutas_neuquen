name: Pruebas de Vialidad

on:
  push:
    paths: ['app.py', 'vialidad.py', 'scripts/**', 'tests/**', 'android/**', '.github/workflows/pruebas.yml']
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node android/tests/core.test.js
